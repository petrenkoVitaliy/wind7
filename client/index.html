<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        body {
            background: #000;
            overflow: hidden;
            touch-action: none;
            height: 100dvh;
        }

        #container {
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        canvas {
            object-fit: cover;
            width: 100vw;
            height: 100vh;
        }

        .glass {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>

<body x-data="visionApp" class="text-white text-sm" x-cloak>

    <div id="container">
        <video id="video" x-ref="video" autoplay playsinline
            style="position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px;"></video>
        <canvas id="canvas" x-ref="canvas"></canvas>

        <div x-show="loading" x-transition.opacity
            class="absolute inset-0 z-[100] flex flex-col items-center justify-center bg-black/80 backdrop-blur-md">
            <div class="w-16 h-16 border-4 border-green-500/20 border-t-green-500 rounded-full animate-spin mb-4">
            </div>
            <div class="text-green-400 font-mono text-sm tracking-widest animate-pulse">ESTABLISHING AI LINK...
            </div>
            <div class="text-[10px] text-white/40 mt-2" x-text="'ICE: ' + iceState"></div>
        </div>

        <div class="absolute top-6 left-0 right-0 px-6 flex justify-between items-center z-50">
            <div class="glass px-4 py-2 rounded-full flex items-center gap-2 shadow-lg">
                <div class="w-2 h-2 rounded-full" :class="connected ? 'bg-green-500 animate-pulse' : 'bg-red-500'">
                </div>
                <span class="text-xs font-mono tracking-widest" x-text="connected ? 'LIVE' : 'OFFLINE'"></span>
            </div>

            <div class="flex gap-2 relative">
                <button @click="showLogs = !showLogs" class="glass p-2 rounded-full hover:bg-white/20 transition"
                    :class="showLogs ? 'text-blue-400' : 'text-white'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </button>
                <button @click="showMetrics = !showMetrics" class="glass p-2 rounded-full hover:bg-white/20 transition"
                    :class="showMetrics ? 'text-green-400' : 'text-white'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 13a2 2 0 100-4 2 2 0 000 4z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11V6" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 12a9 9 0 00-18 0" />
                    </svg>
                </button>
                <button @click="showStats = !showStats; if(showStats) fetchStats()"
                    class="glass p-2 rounded-full hover:bg-white/20 transition"
                    :class="showStats ? 'text-purple-400' : 'text-white'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z" />
                    </svg>
                </button>
                <button @click="showControls = !showControls"
                    class="glass p-2 rounded-full hover:bg-white/20 transition"
                    :class="showControls ? 'text-orange-400' : 'text-white'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
                    </svg>
                </button>
                <button @click="window.location.reload()" class="glass p-2 rounded-full hover:bg-white/10 text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>

        <div x-show="showStats" x-transition class="absolute top-20 right-6 z-50 pointer-events-auto">
            <div class="glass px-4 py-3 rounded-xl flex flex-col gap-2 text-[10px] font-mono w-52 shadow-xl">
                <div class="text-white/50 font-bold tracking-widest mb-1">INSTANCE STATS</div>
                <div class="flex justify-between"><span>GPU:</span> <span class="text-purple-400 truncate ml-2"
                        x-text="stats.gpu"></span></div>
                <div class="flex justify-between"><span>GPU Load:</span> <span class="text-white font-bold"
                        x-text="stats.gpu_load"></span></div>
                <div class="flex justify-between"><span>VRAM:</span> <span class="text-gray-300"
                        x-text="stats.vram"></span></div>
                <div class="w-full h-px bg-white/20 my-0.5"></div>
                <div class="flex justify-between"><span>CPU Load:</span> <span class="text-white"
                        x-text="stats.cpu"></span></div>
                <div class="flex justify-between"><span>RAM:</span> <span class="text-gray-300"
                        x-text="stats.ram"></span></div>
                <button @click="fetchStats()"
                    class="mt-2 w-full py-1.5 rounded bg-white/10 hover:bg-white/20 transition active:scale-95 font-bold">REFRESH</button>
            </div>
        </div>

        <div x-show="showMetrics" x-transition class="absolute top-20 left-6 z-40 pointer-events-none">
            <div class="glass px-3 py-2 rounded-xl flex flex-col gap-1 text-[10px] font-mono text-green-400">
                <div>Ping: <span class="text-white" x-text="latency"></span>ms</div>
                <div>FPS (Client): <span class="text-white" x-text="clientFps"></span></div>
                <div>FPS (AI): <span class="text-white" x-text="serverFps"></span></div>
                <div class="w-full h-px bg-white/20 my-0.5"></div>
                <div>Pre: <span class="text-gray-300" x-text="metrics.pre"></span>ms</div>
                <div>Inf: <span class="text-white font-bold" x-text="metrics.inf"></span>ms</div>
                <div>Norm: <span class="text-white font-bold" x-text="metrics.normalize"></span>ms</div>
                <div>Post: <span class="text-gray-300" x-text="metrics.post"></span>ms</div>
                <div>Total: <span class="text-yellow-400" x-text="metrics.total"></span>ms</div>
                <div class="w-full h-px bg-white/20 my-0.5"></div>
                <div>Avg Pre: <span class="text-gray-300" x-text="averageMetrics.aggregation.pre"></span>ms</div>
                <div>Avg Inf: <span class="text-white font-bold" x-text="averageMetrics.aggregation.inf"></span>ms
                </div>
                <div>Avg Norm: <span class="text-white font-bold"
                        x-text="averageMetrics.aggregation.normalize"></span>ms</div>
                <div>Avg Post: <span class="text-gray-300" x-text="averageMetrics.aggregation.post"></span>ms</div>
                <div>Avg Total: <span class="text-yellow-400" x-text="averageMetrics.aggregation.total"></span>ms
                </div>
            </div>
        </div>

        <div x-show="showLogs" x-transition class="absolute top-20 right-6 left-6 bottom-48 z-40 pointer-events-none">
            <div class="glass w-full h-full rounded-2xl overflow-hidden flex flex-col pointer-events-auto">
                <div class="px-4 py-2 border-b border-white/10 flex justify-between items-center bg-white/5">
                    <span class="text-[10px] font-bold tracking-widest opacity-50">SYSTEM LOGS</span>
                    <button @click="logs = []" class="text-[10px] text-red-400 hover:text-red-300">CLEAR</button>
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar p-4 font-mono text-[9px] space-y-1">
                    <template x-for="(log, i) in logs" :key="i">
                        <div class="flex gap-2">
                            <span class="opacity-30" x-text="log.time"></span>
                            <span
                                :class="{ 'text-white': log.type === 'log', 'text-red-400': log.type === 'error', 'text-yellow-400': log.type === 'warn', 'text-blue-400': log.type === 'info' }"
                                x-text="log.msg"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div x-show="showControls" x-transition class="absolute bottom-6 left-4 right-4 z-50 mb-safe">
            <div class="glass rounded-3xl p-4 flex flex-col gap-3 shadow-2xl">

                <div class="grid grid-cols-2 gap-2">

                    <div class="relative" @click.away="openDrop = openDrop === 'task' ? null : openDrop">
                        <button @click="openDrop = openDrop === 'task' ? null : 'task'"
                            class="w-full bg-white/10 px-3 py-2 rounded-xl text-left flex justify-between items-center hover:bg-white/20 transition">
                            <span class="text-xs font-semibold truncate"
                                x-text="tasks.find(t => t.id === config.task)?.name || 'Task'"></span>
                            <svg class="w-3 h-3 opacity-50 shrink-0" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div x-show="openDrop === 'task'" x-transition
                            class="absolute bottom-full mb-1 left-0 w-full glass rounded-xl overflow-hidden z-50 shadow-xl border border-white/10">
                            <template x-for="t in tasks" :key="t.id">
                                <button @click="config.task = t.id; openDrop = null; sendConfig()"
                                    class="w-full text-left px-3 py-2 hover:bg-white/10 transition border-b border-white/5 last:border-0">
                                    <div class="text-xs font-bold"
                                        :class="config.task === t.id ? 'text-green-400' : 'text-white'" x-text="t.name">
                                    </div>
                                    <div class="text-[10px] text-white/50" x-text="t.desc"></div>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="relative" @click.away="openDrop = openDrop === 'model' ? null : openDrop">
                        <button @click="openDrop = openDrop === 'model' ? null : 'model'"
                            class="w-full bg-white/10 px-3 py-2 rounded-xl text-left flex justify-between items-center hover:bg-white/20 transition text-green-400">
                            <span class="text-xs font-semibold truncate"
                                x-text="modelsList.find(m => m.id === config.model)?.name || 'Loading Model...'"></span>
                            <svg class="w-3 h-3 opacity-50 shrink-0 text-white" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div x-show="openDrop === 'model'" x-transition
                            class="absolute bottom-full mb-1 left-0 w-full glass rounded-xl overflow-y-auto max-h-48 custom-scrollbar z-50 shadow-xl border border-white/10">
                            <template x-for="m in modelsList" :key="m.id">
                                <button @click="config.model = m.id; openDrop = null; sendConfig()"
                                    class="w-full text-left px-3 py-2 hover:bg-white/10 transition border-b border-white/5 last:border-0">
                                    <div class="text-xs font-bold"
                                        :class="config.model === m.id ? 'text-green-400' : 'text-white'"
                                        x-text="m.name"></div>
                                    <div class="text-[10px] text-white/50" x-text="m.desc"></div>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="relative transition-opacity duration-300"
                        :class="config.task !== 'track' ? 'opacity-40 pointer-events-none' : ''"
                        @click.away="openDrop = openDrop === 'tracker' ? null : openDrop">
                        <button @click="openDrop = openDrop === 'tracker' ? null : 'tracker'"
                            class="w-full bg-white/10 px-3 py-2 rounded-xl text-left flex justify-between items-center hover:bg-white/20 transition text-blue-300">
                            <span class="text-xs font-semibold truncate"
                                x-text="trackers.find(t => t.id === config.tracker)?.name || 'Tracker'"></span>
                            <svg class="w-3 h-3 opacity-50 shrink-0 text-white" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div x-show="openDrop === 'tracker'" x-transition
                            class="absolute bottom-full mb-1 left-0 w-full glass rounded-xl overflow-hidden z-50 shadow-xl border border-white/10">
                            <template x-for="t in trackers" :key="t.id">
                                <button @click="config.tracker = t.id; openDrop = null; sendConfig()"
                                    class="w-full text-left px-3 py-2 hover:bg-white/10 transition border-b border-white/5 last:border-0">
                                    <div class="text-xs font-bold"
                                        :class="config.tracker === t.id ? 'text-blue-400' : 'text-white'"
                                        x-text="t.name"></div>
                                    <div class="text-[10px] text-white/50" x-text="t.desc"></div>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="relative" @click.away="openDrop = openDrop === 'quality' ? null : openDrop">
                        <button @click="openDrop = openDrop === 'quality' ? null : 'quality'"
                            class="w-full bg-white/10 px-3 py-2 rounded-xl text-left flex justify-between items-center hover:bg-white/20 transition text-yellow-300">
                            <span class="text-xs font-semibold truncate"
                                x-text="currentQuality.name + ' (' + currentQuality.res + ')'"></span>
                            <svg class="w-3 h-3 opacity-50 shrink-0 text-white" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path d="M19 9l-7 7-7-7" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div x-show="openDrop === 'quality'" x-transition
                            class="absolute bottom-full mb-1 left-0 w-full glass rounded-xl overflow-hidden z-50 shadow-xl border border-white/10">
                            <template x-for="q in qualities" :key="q.name">
                                <button @click="qualityName = q.name; openDrop = null; applyQuality()"
                                    class="w-full text-left px-3 py-2 hover:bg-white/10 transition border-b border-white/5 last:border-0">
                                    <div class="text-xs font-bold"
                                        :class="qualityName === q.name ? 'text-yellow-400' : 'text-white'"
                                        x-text="q.name + ' (' + q.res + ')'"></div>
                                    <div class="text-[10px] text-white/50" x-text="q.desc"></div>
                                </button>
                            </template>
                        </div>
                    </div>

                </div>

                <div class="flex items-center gap-3 text-xs px-1">
                    <span class="opacity-70 font-mono">CONF</span>
                    <input type="range" min="0.1" max="0.9" step="0.05" x-model="config.conf" @change="sendConfig()"
                        class="flex-1 accent-green-500">
                    <span class="w-8 text-right font-mono text-green-400" x-text="config.conf"></span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button @click="toggleSync()"
                        class="flex justify-between items-center bg-black/40 px-3 py-2.5 rounded-xl border border-white/5 active:scale-95 transition-transform">
                        <span class="text-[10px] font-bold" :class="syncMode ? 'text-green-400' : 'text-white'">Sync
                            Render</span>
                        <div class="w-8 h-4 rounded-full bg-gray-600 transition-colors"
                            :class="syncMode ? '!bg-green-500' : ''">
                            <div class="w-3 h-3 mt-0.5 ml-0.5 rounded-full bg-white transition-transform duration-300"
                                :class="syncMode ? 'translate-x-4' : 'translate-x-0'"></div>
                        </div>
                    </button>

                    <button @click="toggleMasks()"
                        class="flex justify-between items-center bg-black/40 px-3 py-2.5 rounded-xl border border-white/5 active:scale-95 transition-transform">
                        <span class="text-[10px] font-bold"
                            :class="isMasks ? 'text-green-400' : 'text-white'">Masks</span>
                        <div class="w-8 h-4 rounded-full bg-gray-600 transition-colors"
                            :class="isMasks ? '!bg-green-500' : ''">
                            <div class="w-3 h-3 mt-0.5 ml-0.5 rounded-full bg-white transition-transform duration-300"
                                :class="isMasks ? 'translate-x-4' : 'translate-x-0'"></div>
                        </div>
                    </button>

                    <button @click="toggleRetinaMasks()"
                        class="flex justify-between items-center bg-black/40 px-3 py-2.5 rounded-xl border border-white/5 active:scale-95 transition-transform">
                        <span class="text-[10px] font-bold"
                            :class="isRetinaMasks ? 'text-green-400' : 'text-white'">Retina</span>
                        <div class="w-8 h-4 rounded-full bg-gray-600 transition-colors"
                            :class="isRetinaMasks ? '!bg-green-500' : ''">
                            <div class="w-3 h-3 mt-0.5 ml-0.5 rounded-full bg-white transition-transform duration-300"
                                :class="isRetinaMasks ? 'translate-x-4' : 'translate-x-0'"></div>
                        </div>
                    </button>

                    <button @click="toggleLabels()"
                        class="flex justify-between items-center bg-black/40 px-3 py-2.5 rounded-xl border border-white/5 active:scale-95 transition-transform">
                        <span class="text-[10px] font-bold"
                            :class="drawLabels ? 'text-green-400' : 'text-white'">Labels</span>
                        <div class="w-8 h-4 rounded-full bg-gray-600 transition-colors"
                            :class="drawLabels ? '!bg-green-500' : ''">
                            <div class="w-3 h-3 mt-0.5 ml-0.5 rounded-full bg-white transition-transform duration-300"
                                :class="drawLabels ? 'translate-x-4' : 'translate-x-0'"></div>
                        </div>
                    </button>
                </div>

                <button @click="connected ? stop() : start()"
                    class="w-full py-3.5 rounded-xl font-bold tracking-wide shadow-lg active:scale-[0.98] transition-all"
                    :class="connected ? 'bg-red-500/90 text-white' : 'bg-white text-black'">
                    <span x-text="connected ? 'STOP CAMERA' : 'LAUNCH AI'"></span>
                </button>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('visionApp', () => ({
                connected: false,
                loading: false,
                iceState: 'new',

                isMasks: true,
                isRetinaMasks: true,
                syncMode: false,
                drawLabels: false,

                showControls: true,
                showMetrics: false,
                showLogs: false,
                showStats: false,
                openDrop: null,

                config: { model: '', task: 'track', tracker: 'bytetrack', conf: 0.4 },

                tasks: [
                    { id: 'track', name: 'Track (IDs)', desc: 'Track objects across frames' },
                    { id: 'predict', name: 'Predict (No IDs)', desc: 'Standard YOLO detection' }
                ],
                trackers: [
                    { id: 'bytetrack', name: 'ByteTrack', desc: 'ONNX only' },
                    { id: 'botsort', name: 'BoT-SORT', desc: 'ONNX only' }
                ],
                qualities: [
                    { name: 'FullHD Accuracy', desc: '', w: 1920, h: 1080, res: '1080p' },
                    { name: 'High Accuracy', desc: '', w: 1280, h: 720, res: '720p' },
                    { name: 'Balanced', desc: '', w: 640, h: 480, res: '480p' },
                    { name: 'Performance', desc: '', w: 320, h: 240, res: '240p' },
                ],
                modelsList: [],

                metrics: { pre: 0, inf: 0, post: 0, total: 0, normalize: 0 },
                averageMetrics: { max: 5, metrics: [], aggregation: { pre: 0, inf: 0, post: 0, total: 0, normalize: 0 } },
                stats: { cpu: '...', ram: '...', gpu: '...', gpu_load: '...', vram: '...' },

                clientFps: 0,
                serverFps: 0,
                latency: 0,
                logs: [],

                qualityName: 'High Accuracy',
                currentQuality: { name: 'High Accuracy', w: 1280, h: 720, res: '720p' },

                pc: null,
                dc: null,
                currentPredictions: [],
                lastFrameTime: performance.now(),
                lastServerTime: performance.now(),

                frameBuffer: [],
                captureFrameId: null,

                async init() {
                    this.hookConsole();
                    try {
                        const res = await fetch('/models');
                        const data = await res.json();

                        this.stats = data.stats;

                        this.modelsList = data.models.map(({ name, description }) => ({ id: name, name, desc: description }));

                        if (this.modelsList.length > 0) {
                            this.config.model = this.modelsList[0].id;
                        }
                    } catch (e) {
                        console.error("Models fetch failed");
                    }

                    setInterval(() => this.measureLatency(), 1000);
                },

                hookConsole() {
                    const types = ['log', 'error', 'warn', 'info'];
                    types.forEach(type => {
                        const original = console[type];
                        console[type] = (...args) => {
                            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
                            const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                            this.logs.unshift({ type, msg, time });
                            if (this.logs.length > 100) this.logs.pop();
                            original.apply(console, args);
                        };
                    });
                },

                measureLatency() {
                    if (this.dc && this.dc.readyState === 'open') {
                        this.dc.send(JSON.stringify({ type: 'ping', timestamp: performance.now() }));
                    }
                },

                async fetchStats() {
                    try {
                        const res = await fetch('/stats');
                        this.stats = (await res.json()).stats;
                    } catch (e) { }
                },

                async start() {
                    const constraints = { video: { width: { ideal: this.currentQuality.w }, height: { ideal: this.currentQuality.h }, facingMode: 'environment' } };
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia(constraints);
                        this.$refs.video.srcObject = stream;
                        this.connected = true;
                        this.loading = true;

                        this.$refs.video.onloadedmetadata = () => {
                            this.$refs.canvas.width = this.$refs.video.videoWidth;
                            this.$refs.canvas.height = this.$refs.video.videoHeight;
                            this.startCaptureLoop();
                        };
                        await this.setupWebRTC(stream);
                    } catch (err) {
                        console.error("Camera error:", err);
                        alert("Camera error: " + err);
                    }
                },

                stop() {
                    if (this.$refs.video.srcObject) this.$refs.video.srcObject.getTracks().forEach(t => t.stop());
                    if (this.pc) this.pc.close();
                    if (this.captureFrameId) cancelAnimationFrame(this.captureFrameId);
                    this.connected = false;
                    this.currentPredictions = [];

                    this.frameBuffer.forEach(f => f.bitmap.close());
                    this.frameBuffer = [];

                    const ctx = this.$refs.canvas.getContext('2d');
                    ctx.clearRect(0, 0, this.$refs.canvas.width, this.$refs.canvas.height);
                },

                async applyQuality() {
                    const q = this.qualities.find(x => x.name === this.qualityName);
                    if (q) {
                        this.currentQuality = q;
                        if (this.connected) { this.stop(); await this.start(); }
                    }
                },

                sendConfig() {
                    if (this.dc && this.dc.readyState === 'open') {
                        this.dc.send(JSON.stringify({
                            type: 'config',
                            model: this.config.model,
                            task: this.config.task,
                            tracker: this.config.tracker,
                            conf: parseFloat(this.config.conf),
                            retina_masks: this.isRetinaMasks
                        }));
                    }
                },

                toggleRetinaMasks() {
                    this.isRetinaMasks = !this.isRetinaMasks;
                    this.sendConfig();
                },

                toggleMasks() {
                    this.isMasks = !this.isMasks;
                },

                toggleSync() {
                    this.syncMode = !this.syncMode;
                },

                toggleLabels() {
                    this.drawLabels = !this.drawLabels;
                },

                async setupWebRTC(stream) {
                    const response = await fetch('/ice-config');
                    const config = await response.json();

                    this.pc = new RTCPeerConnection(config);
                    stream.getTracks().forEach(track => {
                        this.pc.addTrack(track, stream);
                    });

                    this.dc = this.pc.createDataChannel("results");
                    this.dc.onopen = () => {
                        console.log("DataChannel opened");
                        this.sendConfig();
                    };

                    this.pc.oniceconnectionstatechange = () => {
                        this.iceState = this.pc.iceConnectionState;
                        if (['failed', 'closed'].includes(this.pc.iceConnectionState)) {
                            this.loading = false;
                        }
                    };

                    this.pc.onicecandidateerror = (e) => {
                        console.error("ICE Error:", e.errorCode, e.errorText);
                    };

                    this.pc.ontrack = (event) => {
                        console.log("received track:", event.track.kind);
                    };

                    this.dc.onmessage = (evt) => {
                        const payload = JSON.parse(evt.data);

                        if (payload.type === 'pong') {
                            this.latency = Math.round(performance.now() - payload.timestamp);
                            return;
                        }
                        if (payload.metrics) {
                            if (this.loading) {
                                console.log("First AI results received!");
                                this.loading = false;
                            }
                            this.currentPredictions = payload.data;
                            this.metrics = payload.metrics;

                            this.averageMetrics.metrics.push(payload.metrics);
                            if (this.averageMetrics.metrics.length > this.averageMetrics.max) {
                                this.averageMetrics.metrics.shift();
                            }

                            this.averageMetrics.aggregation = this.averageMetrics.metrics.reduce((acc, m) => {
                                acc.pre += m.pre; acc.inf += m.inf; acc.post += m.post; acc.total += m.total; acc.normalize += m.normalize;
                                return acc;
                            }, { pre: 0, inf: 0, post: 0, total: 0, normalize: 0 });

                            const len = this.averageMetrics.metrics.length;
                            for (let key in this.averageMetrics.aggregation) {
                                this.averageMetrics.aggregation[key] = Math.round(this.averageMetrics.aggregation[key] / len);
                            }

                            const now = performance.now();
                            this.serverFps = Math.round(1000 / (now - this.lastServerTime));
                            this.lastServerTime = now;

                            if (this.syncMode && this.connected) {
                                const estimatedAge = performance.now() - this.latency - this.metrics.total;
                                let bestMatch = null;
                                let minDiff = Infinity;

                                for (let i = 0; i < this.frameBuffer.length; i++) {
                                    const diff = Math.abs(this.frameBuffer[i].time - estimatedAge);
                                    if (diff < minDiff) {
                                        minDiff = diff;
                                        bestMatch = this.frameBuffer[i].bitmap;
                                    }
                                }
                                if (bestMatch) {
                                    this.drawCanvas(bestMatch);
                                }
                            }
                        }
                    };

                    const offer = await this.pc.createOffer();
                    await this.pc.setLocalDescription(offer);

                    await new Promise((resolve) => {
                        if (this.pc.iceGatheringState === 'complete') {
                            resolve();
                        }
                        else {
                            const checkState = () => {
                                if (this.pc.iceGatheringState === 'complete') {
                                    this.pc.removeEventListener('icegatheringstatechange', checkState);
                                    resolve();
                                }
                            };
                            this.pc.addEventListener('icegatheringstatechange', checkState);
                            setTimeout(() => {
                                this.pc.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }, 1500);
                        }
                    });

                    console.log("Sending offer to server...");
                    fetch('/offer', {
                        method: 'POST',
                        body: JSON.stringify({ sdp: this.pc.localDescription.sdp, type: this.pc.localDescription.type }),
                        headers: { 'Content-Type': 'application/json' }
                    })
                        .then(res => res.json())
                        .then(answer => {
                            console.log("Received answer from server");
                            return this.pc.setRemoteDescription(answer);
                        })
                        .catch(e => {
                            console.error("Offer failed:", e);
                            this.loading = false;
                        });
                },

                async startCaptureLoop() {
                    if (!this.connected) return;

                    if (this.$refs.video.readyState >= 2) {
                        try {
                            const bitmap = await createImageBitmap(this.$refs.video);
                            const now = performance.now();
                            this.frameBuffer.push({ time: now, bitmap });

                            while (this.frameBuffer.length > 30 || (this.frameBuffer.length > 0 && now - this.frameBuffer[0].time > 1500)) {
                                this.frameBuffer.shift().bitmap.close();
                            }
                        } catch (e) { }
                    }

                    if (!this.syncMode && this.frameBuffer.length > 0) {
                        this.drawCanvas(this.frameBuffer[this.frameBuffer.length - 1].bitmap);
                    }

                    this.captureFrameId = requestAnimationFrame(() => this.startCaptureLoop());
                },

                drawCanvas(imageSource) {
                    const canvas = this.$refs.canvas;
                    const ctx = canvas.getContext('2d');

                    const now = performance.now();
                    this.clientFps = Math.round(1000 / (now - this.lastFrameTime));
                    this.lastFrameTime = now;

                    if (canvas.width !== imageSource.width) {
                        canvas.width = imageSource.width;
                        canvas.height = imageSource.height;
                    }

                    ctx.drawImage(imageSource, 0, 0, canvas.width, canvas.height);

                    const cw = canvas.width;
                    const ch = canvas.height;
                    const GOLDEN_RATIO_CONJUGATE = 0.618033988749895;

                    ctx.font = '16px monospace';
                    ctx.textBaseline = 'top';
                    ctx.lineJoin = 'round';

                    this.currentPredictions.forEach(pred => {
                        const hasId = pred.id !== undefined && pred.id !== -1;
                        const hue = hasId ? (pred.id * GOLDEN_RATIO_CONJUGATE * 360) % 360 : 120;
                        const color = hasId ? `hsl(${hue}, 100%, 50%)` : '#00ff00';

                        const x1 = pred.box[0] * cw;
                        const y1 = pred.box[1] * ch;
                        const bw = (pred.box[2] - pred.box[0]) * cw;
                        const bh = (pred.box[3] - pred.box[1]) * ch;

                        if (!this.isMasks) {
                            ctx.strokeStyle = color;
                            ctx.lineWidth = 3;
                            ctx.strokeRect(x1, y1, bw, bh);
                        } else if (pred.mask && pred.mask.length > 0) {
                            let path = new Path2D();
                            path.moveTo(pred.mask[0][0] * cw, pred.mask[0][1] * ch);
                            for (let i = 1; i < pred.mask.length; i++) {
                                path.lineTo(pred.mask[i][0] * cw, pred.mask[i][1] * ch);
                            }
                            path.closePath();

                            ctx.globalAlpha = 0.45;
                            ctx.fillStyle = color;
                            ctx.fill(path);
                            ctx.globalAlpha = 1.0;
                        }

                        if (this.drawLabels) {
                            const labelText = `${hasId ? 'id:' + pred.id + ' ' : ''}c:${pred.conf}`;
                            const textWidth = ctx.measureText(labelText).width;

                            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                            ctx.fillRect(x1, y1 - 22, textWidth + 4, 20);

                            ctx.fillStyle = 'white';
                            ctx.fillText(labelText, x1 + 2, y1 - 20);
                        }
                    });
                }
            }));
        });
    </script>
</body>
